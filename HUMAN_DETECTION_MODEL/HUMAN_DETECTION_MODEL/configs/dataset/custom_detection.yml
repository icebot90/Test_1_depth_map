
task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

num_classes: 1
remap_mscoco_category: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: 'C:/Users/ARUSH M VERNEKAR/OneDrive/Documents/D-Fine/dfine_dataset/images/train'
    ann_file: 'C:/Users/ARUSH M VERNEKAR/OneDrive/Documents/D-Fine/dfine_dataset/annotations/instances_train.json'
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 2
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: 'C:/Users/ARUSH M VERNEKAR/OneDrive/Documents/D-Fine/dfine_dataset/images/valid'
    ann_file: 'C:/Users/ARUSH M VERNEKAR/OneDrive/Documents/D-Fine/dfine_dataset/annotations/instances_val.json'
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 2
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
